{# Inline SVG icons (no emoji, no icon CDN). Decorative by default: aria-hidden. #}
{% macro icon(name, label=None) -%}
<svg class="icon" viewBox="0 0 24 24" {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true" focusable="false"{% endif %}>
{%- if name == 'heart' %}<path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/>
{%- elif name == 'users' %}<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14.2c2.4.3 4 2.2 4 4.8"/>
{%- elif name == 'user-plus' %}<circle cx="10" cy="8" r="3.4"/><path d="M3.5 20c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/><path d="M19 8v6M16 11h6"/>
{%- elif name == 'key' %}<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>
{%- elif name == 'copy' %}<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>
{%- elif name == 'check' %}<path d="M4 12.5l5 5L20 6.5"/>
{%- elif name == 'alert' %}<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18.2v.1"/>
{%- elif name == 'info' %}<circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.1"/>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3 2"/>
{%- elif name == 'lock' %}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'arrow-left' %}<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == 'arrow-right' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'logout' %}<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/>
{%- elif name == 'chevron-down' %}<path d="M6 9l6 6 6-6"/>
{%- elif name == 'file-text' %}<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>
{%- elif name == 'list-check' %}<path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6.5h9M11 12.5h9M11 18.5h9"/>
{%- elif name == 'sparkle' %}<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
{%- elif name == 'settings' %}<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>
{%- elif name == 'home' %}<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>
{%- elif name == 'trash' %}<path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>
{%- elif name == 'shield' %}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>
{%- endif -%}
</svg>
{%- endmacro %}
